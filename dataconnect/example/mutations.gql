# Member Mutations
mutation CreateMember(
  $name: String!
  $gender: String!
  $dateOfBirth: Date!
  $age: Int!
  $address: String!
  $tanzeem: String!
  $fatherName: String
  $husbandName: String
  $cnic: String
  $phone: String
  $profilePhoto: String
  $familyId: String
  $halqa: String
  $talem: String
) {
  member_insert(data: {
    name: $name
    fatherName: $fatherName
    husbandName: $husbandName
    gender: $gender
    cnic: $cnic
    dateOfBirth: $dateOfBirth
    age: $age
    phone: $phone
    address: $address
    profilePhoto: $profilePhoto
    tanzeem: $tanzeem
    familyId: $familyId
    halqa: $halqa
    talem: $talem
  }) {
    id
    name
    gender
    tanzeem
  }
}

mutation UpdateMember(
  $id: String!
  $name: String
  $fatherName: String
  $husbandName: String
  $gender: String
  $cnic: String
  $dateOfBirth: Date
  $age: Int
  $phone: String
  $address: String
  $profilePhoto: String
  $tanzeem: String
  $familyId: String
  $halqa: String
  $hasNewTanzeemTransition: Boolean
  $talem: String
  $isDeceased: Boolean
  $dateOfDeath: Date
) {
  member_update(id: $id, data: {
    name: $name
    fatherName: $fatherName
    husbandName: $husbandName
    gender: $gender
    cnic: $cnic
    dateOfBirth: $dateOfBirth
    age: $age
    phone: $phone
    address: $address
    profilePhoto: $profilePhoto
    tanzeem: $tanzeem
    familyId: $familyId
    halqa: $halqa
    hasNewTanzeemTransition: $hasNewTanzeemTransition
    talem: $talem
    isDeceased: $isDeceased
    dateOfDeath: $dateOfDeath
  }) {
    id
    name
    tanzeem
  }
}

mutation DeleteMember($id: String!) {
  member_delete(id: $id) {
    id
  }
}

# Family Mutations
mutation CreateFamily(
  $headId: String!
  $familyName: String!
  $familyNumber: Int
  $totalMembers: Int!
  $halqa: String
  $familyHistory: String
) {
  family_insert(data: {
    headId: $headId
    familyName: $familyName
    familyNumber: $familyNumber
    totalMembers: $totalMembers
    halqa: $halqa
    familyHistory: $familyHistory
  }) {
    id
    familyName
    totalMembers
  }
}

mutation UpdateFamily(
  $id: String!
  $headId: String
  $familyName: String
  $familyNumber: Int
  $totalMembers: Int
  $halqa: String
  $familyHistory: String
) {
  family_update(id: $id, data: {
    headId: $headId
    familyName: $familyName
    familyNumber: $familyNumber
    totalMembers: $totalMembers
    halqa: $halqa
    familyHistory: $familyHistory
  }) {
    id
    familyName
    totalMembers
  }
}

mutation DeleteFamily($id: String!) {
  family_delete(id: $id) {
    id
  }
}

