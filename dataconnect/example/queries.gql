# Member Queries
query GetAllMembers {
  members {
    id
    name
    fatherName
    husbandName
    gender
    cnic
    dateOfBirth
    age
    phone
    address
    profilePhoto
    tanzeem
    familyId
    halqa
    hasNewTanzeemTransition
    talem
    isDeceased
    dateOfDeath
    createdAt
    updatedAt
  }
}

query GetMemberById($id: String!) {
  member(id: $id) {
    id
    name
    fatherName
    husbandName
    gender
    cnic
    dateOfBirth
    age
    phone
    address
    profilePhoto
    tanzeem
    familyId
    halqa
    hasNewTanzeemTransition
    talem
    isDeceased
    dateOfDeath
    createdAt
    updatedAt
  }
}

query GetMembersByTanzeem($tanzeem: String!) {
  members(where: { tanzeem: { eq: $tanzeem } }) {
    id
    name
    gender
    age
    tanzeem
    familyId
    halqa
  }
}

query GetMembersByFamily($familyId: String!) {
  members(where: { familyId: { eq: $familyId } }) {
    id
    name
    gender
    age
    tanzeem
    phone
    address
  }
}

# Family Queries
query GetAllFamilies {
  families {
    id
    headId
    familyName
    familyNumber
    totalMembers
    halqa
    familyHistory
    createdAt
    updatedAt
  }
}

query GetFamilyById($id: String!) {
  family(id: $id) {
    id
    headId
    familyName
    familyNumber
    totalMembers
    halqa
    familyHistory
    createdAt
    updatedAt
  }
}

# Religious Activities Queries
query GetReligiousActivitiesByMember($memberId: String!) {
  religiousActivities(where: { memberId: { eq: $memberId } }) {
    id
    memberId
    fiveDailyPrayers
    congregationalPrayers
    weeklyTahajjud
    dailyRecitation
    fridayPrayer
    twoNaflDaily
    weeklyVoluntaryFast
    prayerMovement
    dailyThreePrayers
    sermonListening
    listenedThisWeek
    quranRecitation
    prayerWithTranslation
    prayerLetterWriting
    willWritten
    mtaDish
    mtaCable
    mtaInternet
    internetAccess
    notes
    lastUpdated
  }
}

# Dashboard Statistics
query GetDashboardStats {
  members {
    gender
    tanzeem
    isDeceased
  }
  families {
    id
  }
}