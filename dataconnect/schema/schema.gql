# Tajneed Admin Dashboard Schema

# User table for authentication
type User @table {
  id: String! @default(expr: "auth.uid")
  email: String! @col(dataType: "varchar(255)")
  displayName: String @col(dataType: "varchar(100)")
  createdAt: Timestamp! @default(expr: "request.time")
  updatedAt: Timestamp! @default(expr: "request.time")
}

# Family table
type Family @table {
  id: String! @default(expr: "uuidV4()")
  headId: String! @col(dataType: "varchar(255)")
  familyName: String! @col(dataType: "varchar(255)")
  familyNumber: Int
  totalMembers: Int! @default(expr: "0")
  halqa: String @col(dataType: "varchar(100)")
  familyHistory: String @col(dataType: "text")
  createdAt: Timestamp! @default(expr: "request.time")
  updatedAt: Timestamp! @default(expr: "request.time")
}

# Member table
type Member @table {
  id: String! @default(expr: "uuidV4()")
  name: String! @col(dataType: "varchar(255)")
  fatherName: String @col(dataType: "varchar(255)")
  husbandName: String @col(dataType: "varchar(255)")
  gender: String! @col(dataType: "varchar(10)")
  cnic: String @col(dataType: "varchar(20)")
  dateOfBirth: Date!
  age: Int!
  phone: String @col(dataType: "varchar(20)")
  address: String! @col(dataType: "text")
  profilePhoto: String @col(dataType: "text")
  tanzeem: String! @col(dataType: "varchar(50)")
  familyId: String @col(dataType: "varchar(255)")
  halqa: String @col(dataType: "varchar(100)")
  hasNewTanzeemTransition: Boolean @default(expr: "false")
  talem: String @col(dataType: "varchar(100)")
  isDeceased: Boolean @default(expr: "false")
  dateOfDeath: Date
  createdAt: Timestamp! @default(expr: "request.time")
  updatedAt: Timestamp! @default(expr: "request.time")
}

# Religious Activities table
type ReligiousActivity @table {
  id: String! @default(expr: "uuidV4()")
  memberId: String! @col(dataType: "varchar(255)")
  fiveDailyPrayers: Int @default(expr: "0")
  congregationalPrayers: Int @default(expr: "0")
  weeklyTahajjud: Boolean @default(expr: "false")
  dailyRecitation: Boolean @default(expr: "false")
  fridayPrayer: Boolean @default(expr: "false")
  twoNaflDaily: Boolean @default(expr: "false")
  weeklyVoluntaryFast: Boolean @default(expr: "false")
  prayerMovement: Boolean @default(expr: "false")
  dailyThreePrayers: Boolean @default(expr: "false")
  sermonListening: Boolean @default(expr: "false")
  listenedThisWeek: Boolean @default(expr: "false")
  quranRecitation: Boolean @default(expr: "false")
  prayerWithTranslation: Boolean @default(expr: "false")
  prayerLetterWriting: Boolean @default(expr: "false")
  willWritten: Boolean @default(expr: "false")
  mtaDish: Boolean @default(expr: "false")
  mtaCable: Boolean @default(expr: "false")
  mtaInternet: Boolean @default(expr: "false")
  internetAccess: Boolean @default(expr: "false")
  notes: String @col(dataType: "text")
  lastUpdated: Timestamp! @default(expr: "request.time")
}
